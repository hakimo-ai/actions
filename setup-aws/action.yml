name: Setup ECR
description: Checkout, configure AWS credentials, and log in to Amazon ECR. Bundles the three setup steps shared by every CI workflow.

inputs:
  role-to-assume:
    description: IAM role ARN to assume via OIDC
    required: true
  aws-region:
    description: AWS region (e.g. us-west-2)
    required: true
  fetch-depth:
    description: Number of commits to fetch. 0 = full history. Passed to actions/checkout.
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Workaround Git safe-directory for Docker-based runners
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6
