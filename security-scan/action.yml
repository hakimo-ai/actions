name: Security Scan
description: Language-aware security scan — auto-detects Python/Node/Rust/C#/IaC and runs Grype, Trivy, and Semgrep accordingly. Open-source tools only, no GitHub Advanced Security dependency.

inputs:
  path:
    description: Root path to scan. Used by Trivy and Semgrep always; used by Grype only when image is not set.
    required: false
    default: '.'
  image:
    description: Full image reference (e.g. <registry>/<repo>:<tag>) for Grype to scan instead of path. Directory-mode Grype scans only catalog manifests Syft directly recognizes - a plain requirements.txt with unresolved/range versions is often invisible to it. Scanning the actual built image (installed site-packages, base OS layer) finds the real dependency CVEs instead. Trivy/Semgrep are unaffected - IaC misconfig, secrets, and SAST are about source, not the built image. Requires role-to-assume and aws-region if the image is in a private registry.
    required: false
    default: ''
  role-to-assume:
    description: IAM role ARN to assume via OIDC, for pulling image from a private registry. Only used when image is set.
    required: false
    default: ''
  aws-region:
    description: AWS region for the ECR login. Only used when image is set.
    required: false
    default: ''
  severity-cutoff:
    description: Minimum vulnerability severity to treat as a finding (negligible, low, medium, high, critical)
    required: false
    default: 'high'
  semgrep-config:
    description: Semgrep ruleset config (e.g. auto, p/python, p/ci)
    required: false
    default: 'auto'
  fail-on-findings:
    description: Fail the job if any scanner reports findings
    required: false
    default: 'false'
  fail-on-secrets:
    description: Fail the job if Trivy finds any secrets, independent of fail-on-findings. Lets the secrets lane be made blocking on its own (e.g. once a repo scans clean) while Grype/Trivy-misconfig/Semgrep stay monitoring-only.
    required: false
    default: 'false'
  semgrep-diff-aware:
    description: On pull_request events, scan only the diff since the PR's base commit (via Semgrep's --baseline-commit) instead of the whole repo, so pre-existing findings unrelated to the PR don't show up every time. Requires enough git history in the caller's checkout to include the base commit (e.g. actions/checkout with fetch-depth 0) - falls back to a full scan with a warning if the base commit isn't available locally. No effect on push/schedule events, which always do a full scan.
    required: false
    default: 'true'
  comment-on-pr:
    description: "Post/update a PR comment with the findings summary (requires 'pull-requests: write' in the caller). No-op outside pull_request/pull_request_target events."
    required: false
    default: 'true'
  max-comment-findings:
    description: Max number of individual findings (most severe first) to list in the collapsed detail section of the PR comment
    required: false
    default: '10'

outputs:
  findings-count:
    description: Total number of findings across all scanners
    value: ${{ steps.gate.outputs.total-findings }}

runs:
  using: composite
  steps:
    - name: Detect project languages
      id: detect
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        cd "$SCAN_PATH" || { echo "::error::path '$SCAN_PATH' not found"; exit 1; }
        prune=( '(' -path '*/node_modules' -o -path '*/.git' ')' )

        detect() {
          local maxdepth="$1"; shift
          find . "${prune[@]}" -prune -o -maxdepth "$maxdepth" "$@" -print 2>/dev/null | grep -q .
        }

        py=false; node=false; rust=false; csharp=false; iac=false
        detect 3 '(' -iname 'requirements*.txt' -o -iname 'pyproject.toml' -o -iname 'setup.py' ')' && py=true
        detect 3 -iname 'package.json' && node=true
        detect 4 -iname 'Cargo.toml' && rust=true
        detect 4 '(' -iname '*.csproj' -o -iname '*.sln' ')' && csharp=true
        detect 4 '(' -iname '*.tf' -o -iname 'Dockerfile*' -o -iname 'kustomization.yaml' -o -iname 'kustomization.yml' ')' && iac=true
        sast=false
        if [ "$py" = true ] || [ "$node" = true ] || [ "$rust" = true ] || [ "$csharp" = true ]; then sast=true; fi
        echo "python=$py" >> "$GITHUB_OUTPUT"
        echo "node=$node" >> "$GITHUB_OUTPUT"
        echo "rust=$rust" >> "$GITHUB_OUTPUT"
        echo "csharp=$csharp" >> "$GITHUB_OUTPUT"
        echo "iac=$iac" >> "$GITHUB_OUTPUT"
        echo "sast=$sast" >> "$GITHUB_OUTPUT"
        {
          echo "### Security scan — detected stack"
          echo "| Python | Node/JS/TS | Rust | C#/.NET | Dockerfile/Terraform/K8s manifests |"
          echo "|---|---|---|---|---|"
          echo "| $py | $node | $rust | $csharp | $iac |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Map severity threshold for Trivy
      id: severity
      shell: bash
      env:
        CUTOFF: ${{ inputs.severity-cutoff }}
      run: |
        case "$CUTOFF" in
          critical) list="CRITICAL" ;;
          high) list="HIGH,CRITICAL" ;;
          medium) list="MEDIUM,HIGH,CRITICAL" ;;
          low|negligible) list="LOW,MEDIUM,HIGH,CRITICAL" ;;
          *) list="MEDIUM,HIGH,CRITICAL" ;;
        esac
        echo "trivy-severity=$list" >> "$GITHUB_OUTPUT"

        # Semgrep only has 3 native levels (ERROR/WARNING/INFO), unlike our
        # 5-level scale - "critical" and "high" both collapse to ERROR-only,
        # "low" and "negligible" both collapse to everything, same pattern
        # as Trivy's own low/negligible collapse above. Semgrep's --severity
        # flag can be repeated but doesn't take a comma list, so the case
        # emits the fully-formed repeated-flag string directly (no
        # intermediate list + loop to re-split it downstream).
        case "$CUTOFF" in
          critical|high) semgrep_args="--severity ERROR" ;;
          medium) semgrep_args="--severity ERROR --severity WARNING" ;;
          low|negligible) semgrep_args="--severity ERROR --severity WARNING --severity INFO" ;;
          *) semgrep_args="--severity ERROR --severity WARNING" ;;
        esac
        echo "semgrep-severity-args=$semgrep_args" >> "$GITHUB_OUTPUT"

    # Duplicated from setup-aws/action.yml rather than calling it directly -
    # setup-aws bundles its own checkout and requires role-to-assume/aws-region,
    # neither of which fits here (checkout already happened, both inputs are
    # optional since image-mode itself is optional). Keep the pinned SHAs
    # below in sync with setup-aws/action.yml when either gets bumped.
    - name: Configure AWS credentials for image-mode Grype
      id: aws-configure
      if: inputs.image != '' && inputs.role-to-assume != ''
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR for image-mode Grype
      id: ecr-login
      if: inputs.image != '' && inputs.role-to-assume != ''
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

    - name: Run Grype (dependency CVEs)
      id: grype
      continue-on-error: true
      uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e  # v6.5.1
      with:
        # path and image are mutually exclusive in anchore/scan-action -
        # only ever send one as non-empty.
        path: ${{ inputs.image == '' && inputs.path || '' }}
        image: ${{ inputs.image }}
        output-format: json
        output-file: grype-results.json
        severity-cutoff: ${{ inputs.severity-cutoff }}
        fail-build: 'false'

    - name: Summarize Grype findings
      id: grype-summary
      if: always()
      shell: bash
      env:
        GRYPE_OUTCOME: ${{ steps.grype.outcome }}
        GRYPE_IMAGE: ${{ inputs.image }}
        GRYPE_PATH: ${{ inputs.path }}
        SEVERITY_CUTOFF: ${{ inputs.severity-cutoff }}
      run: |
        if [ "$GRYPE_OUTCOME" = "failure" ]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "Grype: scan failed to run (see logs) — findings below are incomplete" >> "$GITHUB_STEP_SUMMARY"
        else
          count=$(jq '.matches | length' grype-results.json 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ -n "$GRYPE_IMAGE" ]; then
            scan_target="image $GRYPE_IMAGE"
          else
            scan_target="path $GRYPE_PATH"
          fi
          echo "Grype findings ($scan_target, severity >= $SEVERITY_CUTOFF): $count" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Run Trivy (secrets + IaC misconfig)
      id: trivy
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.path }}
        scanners: secret,misconfig
        severity: ${{ steps.severity.outputs.trivy-severity }}
        format: json
        output: trivy-results.json
        exit-code: '0'

    - name: Summarize Trivy findings
      id: trivy-summary
      if: always()
      shell: bash
      env:
        TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
      run: |
        if [ "$TRIVY_OUTCOME" = "failure" ]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "secrets-count=0" >> "$GITHUB_OUTPUT"
          echo "Trivy: scan failed to run (see logs) — findings below are incomplete" >> "$GITHUB_STEP_SUMMARY"
        else
          # Counted separately (not just combined) so fail-on-secrets can gate
          # on just the secrets lane independent of fail-on-findings, which
          # still gates on the combined secrets+misconfig total below.
          # See the lint-check action's Ruff summary for why these go through
          # awk instead of feeding raw jq output straight into $(( )) - a
          # multi-document trivy-results.json would otherwise crash this
          # arithmetic instead of just reporting a count.
          secrets_count=$(jq '[.Results[]? | (.Secrets // [])[]] | length' trivy-results.json 2>/dev/null | awk '{s+=$1} END {print s+0}')
          misconfig_count=$(jq '[.Results[]? | (.Misconfigurations // [])[]] | length' trivy-results.json 2>/dev/null | awk '{s+=$1} END {print s+0}')
          count=$((secrets_count + misconfig_count))
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "secrets-count=$secrets_count" >> "$GITHUB_OUTPUT"
          echo "Trivy findings (secrets + misconfig): $count ($secrets_count secret(s))" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Restore Semgrep image cache
      id: semgrep-cache
      if: steps.detect.outputs.sast == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: /tmp/semgrep-image.tar
        key: semgrep-image-1.173.0

    - name: Load or pull Semgrep image
      if: steps.detect.outputs.sast == 'true'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.semgrep-cache.outputs.cache-hit }}
      run: |
        image='semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a'
        if [ "$CACHE_HIT" = "true" ]; then
          docker load -i /tmp/semgrep-image.tar
        else
          docker pull "$image"
          docker save "$image" -o /tmp/semgrep-image.tar
        fi

    - name: Run Semgrep SAST
      id: semgrep
      if: steps.detect.outputs.sast == 'true'
      continue-on-error: true
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        DIFF_AWARE: ${{ inputs.semgrep-diff-aware }}
        SEMGREP_SEVERITY_ARGS: ${{ steps.severity.outputs.semgrep-severity-args }}
      run: |
        # git history check runs on the host, not inside the semgrep image -
        # the image is minimal and isn't guaranteed to have git installed,
        # and the mounted volume's .git dir is equally visible from either
        # side anyway.
        baseline_args=""
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$DIFF_AWARE" = "true" ] && [ -n "$BASE_SHA" ]; then
          if git cat-file -e "$BASE_SHA" 2>/dev/null; then
            baseline_args="--baseline-commit $BASE_SHA"
            echo "Semgrep: diff-aware scan against base commit $BASE_SHA"
          else
            echo "::warning::semgrep-diff-aware is enabled but base commit $BASE_SHA isn't available locally (checkout needs more git history, e.g. fetch-depth: 0) - falling back to a full scan"
          fi
        fi

        # severity-cutoff previously only reached Grype/Trivy - Semgrep ran
        # fully unfiltered regardless of the input. SEMGREP_SEVERITY_ARGS is
        # the fully-formed, action-controlled --severity flag string from
        # the "Map severity threshold" step above.
        docker run --rm -v "$PWD:/github/workspace" -w /github/workspace \
          semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
          semgrep scan --config ${{ inputs.semgrep-config }} $baseline_args $SEMGREP_SEVERITY_ARGS --json --output semgrep-results.json ${{ inputs.path }}

    - name: Summarize Semgrep findings
      id: semgrep-summary
      if: always() && steps.detect.outputs.sast == 'true'
      shell: bash
      env:
        SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
      run: |
        if [ "$SEMGREP_OUTCOME" = "failure" ]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "Semgrep: scan failed to run (see logs) — findings below are incomplete" >> "$GITHUB_STEP_SUMMARY"
        else
          count=$(jq '.results | length' semgrep-results.json 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Semgrep findings: $count" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Evaluate findings
      id: gate
      if: always()
      shell: bash
      env:
        GRYPE_COUNT: ${{ steps.grype-summary.outputs.count }}
        GRYPE_FAILED: ${{ steps.grype-summary.outputs.failed }}
        TRIVY_COUNT: ${{ steps.trivy-summary.outputs.count }}
        TRIVY_SECRETS_COUNT: ${{ steps.trivy-summary.outputs.secrets-count }}
        TRIVY_FAILED: ${{ steps.trivy-summary.outputs.failed }}
        SEMGREP_COUNT: ${{ steps.semgrep-summary.outputs.count }}
        SEMGREP_FAILED: ${{ steps.semgrep-summary.outputs.failed }}
        SAST_RAN: ${{ steps.detect.outputs.sast }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        FAIL_ON_SECRETS: ${{ inputs.fail-on-secrets }}
      run: |
        total=$(( ${GRYPE_COUNT:-0} + ${TRIVY_COUNT:-0} + ${SEMGREP_COUNT:-0} ))
        echo "total-findings=$total" >> "$GITHUB_OUTPUT"

        failed=""
        [ "${GRYPE_FAILED:-false}" = "true" ] && failed="${failed}Grype,"
        [ "${TRIVY_FAILED:-false}" = "true" ] && failed="${failed}Trivy,"
        if [ "$SAST_RAN" = "true" ] && [ "${SEMGREP_FAILED:-false}" = "true" ]; then failed="${failed}Semgrep,"; fi
        failed="${failed%,}"

        if [ -n "$failed" ]; then
          echo "any-failed=true" >> "$GITHUB_OUTPUT"
          echo "failed-scanners=$failed" >> "$GITHUB_OUTPUT"
          echo "::error::Scanner(s) failed to run: $failed. Findings below are incomplete."
        else
          echo "any-failed=false" >> "$GITHUB_OUTPUT"
          echo "failed-scanners=" >> "$GITHUB_OUTPUT"
        fi

        if [ "$total" -gt 0 ]; then
          echo "Security scan found $total finding(s) across Grype, Trivy, and Semgrep."
        else
          echo "No findings."
        fi

        secrets_blocking="false"
        if [ "$FAIL_ON_SECRETS" = "true" ] && [ "${TRIVY_SECRETS_COUNT:-0}" -gt 0 ]; then
          secrets_blocking="true"
          echo "::error::fail-on-secrets is set and Trivy found ${TRIVY_SECRETS_COUNT} secret(s)."
        fi

        if [ -n "$failed" ] || { [ "$total" -gt 0 ] && [ "$FAIL_ON_FINDINGS" = "true" ]; } || [ "$secrets_blocking" = "true" ]; then
          exit 1
        fi

    - name: Upload scan reports
      if: always() && (steps.gate.outputs.total-findings != '0' || steps.gate.outputs.any-failed == 'true')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: security-scan-reports
        path: |
          grype-results.json
          trivy-results.json
          semgrep-results.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Post PR comment
      if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && inputs.comment-on-pr == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
      env:
        GRYPE_FAILED: ${{ steps.grype-summary.outputs.failed }}
        TRIVY_FAILED: ${{ steps.trivy-summary.outputs.failed }}
        SEMGREP_FAILED: ${{ steps.semgrep-summary.outputs.failed }}
        ANY_FAILED: ${{ steps.gate.outputs.any-failed }}
        FAILED_SCANNERS: ${{ steps.gate.outputs.failed-scanners }}
        SAST_RAN: ${{ steps.detect.outputs.sast }}
        SEVERITY_CUTOFF: ${{ inputs.severity-cutoff }}
        GRYPE_IMAGE: ${{ inputs.image }}
        MAX_FINDINGS: ${{ inputs.max-comment-findings }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- hakimo-ai/actions/security-scan -->';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const anyFailed = process.env.ANY_FAILED === 'true';

          // --- Pull the actual findings out of the JSON reports ---
          const readJson = (file) => {
            try {
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch {
              return null;
            }
          };
          const asArray = (v) => (Array.isArray(v) ? v : []);

          // Each tool has its own severity vocabulary (Grype: Critical/High/...,
          // Trivy: CRITICAL/HIGH/..., Semgrep: ERROR/WARNING/INFO) - normalized
          // into one 5-bucket scale so the header/table/emoji are consistent
          // across all three scanners.
          const SEVERITY_BUCKETS = {
            critical: 'critical', error: 'critical',
            high: 'high',
            medium: 'medium', moderate: 'medium', warning: 'medium',
            low: 'low',
            negligible: 'unknown', info: 'unknown', unknown: 'unknown',
          };
          const SEVERITY_RANK = { critical: 0, high: 1, medium: 2, low: 3, unknown: 4 };
          const SEVERITY_EMOJI = { critical: '\u{1F534}', high: '\u{1F7E0}', medium: '\u{1F7E1}', low: '\u{1F535}', unknown: '⚪' };
          const bucket = (s) => SEVERITY_BUCKETS[String(s || '').toLowerCase()] ?? 'unknown';

          const findings = [];
          const push = (tool, severity, rule, text) =>
            findings.push({ tool, severity: bucket(severity), rule: rule || 'unknown', text });

          for (const m of asArray(readJson('grype-results.json')?.matches)) {
            push('Grype', m.vulnerability?.severity, m.vulnerability?.id, `in \`${m.artifact?.name || '?'}@${m.artifact?.version || '?'}\``);
          }

          for (const r of asArray(readJson('trivy-results.json')?.Results)) {
            for (const s of asArray(r.Secrets)) {
              push('Trivy', s.Severity, s.RuleID || s.Title, `in \`${r.Target || '?'}:${s.StartLine ?? '?'}\``);
            }
            for (const mc of asArray(r.Misconfigurations)) {
              push('Trivy', mc.Severity, mc.ID, `${mc.Title || ''} in \`${r.Target || '?'}\``.trim());
            }
          }

          if (process.env.SAST_RAN === 'true') {
            for (const r of asArray(readJson('semgrep-results.json')?.results)) {
              push('Semgrep', r.extra?.severity, r.check_id, `in \`${r.path}:${r.start?.line ?? '?'}\``);
            }
          }

          // --- Severity breakdown, overall and per-scanner (drives the header
          // line and the per-scanner table columns) ---
          const countBy = (list, pred) => list.filter(pred).length;
          const severityTotals = Object.fromEntries(
            Object.keys(SEVERITY_RANK).map((sev) => [sev, countBy(findings, (f) => f.severity === sev)]),
          );
          const headerLine = Object.keys(SEVERITY_RANK)
            .filter((sev) => severityTotals[sev] > 0)
            .map((sev) => `${SEVERITY_EMOJI[sev]} ${severityTotals[sev]} ${sev}`)
            .join(' · ');

          const bySeverityCols = (tool) =>
            Object.keys(SEVERITY_RANK)
              .map((sev) => countBy(findings, (f) => f.tool === tool && f.severity === sev))
              .map((n) => (n > 0 ? String(n) : '-'));

          const scannerRow = (label, tool, failed) =>
            failed === 'true'
              ? `| ${label} | | | | | | failed to run - see [logs](${runUrl}) |`
              : `| ${label} | ${bySeverityCols(tool).join(' | ')} | ${countBy(findings, (f) => f.tool === tool)} |`;

          const semgrepRow = process.env.SAST_RAN === 'true'
            ? scannerRow('Semgrep (SAST)', 'Semgrep', process.env.SEMGREP_FAILED)
            : '| Semgrep (SAST) | | | | | | skipped - no Python/Node/Rust/C# detected |';

          // --- Group findings by (tool, rule, severity) so repeated hits of
          // the same rule (e.g. one Semgrep check firing on 27 near-identical
          // lines) collapse into a single row with a count, instead of
          // burying the top-N list under duplicates of one rule. ---
          const groups = new Map();
          for (const f of findings) {
            const key = `${f.tool}::${f.rule}::${f.severity}`;
            if (!groups.has(key)) {
              groups.set(key, { tool: f.tool, rule: f.rule, severity: f.severity, count: 0, example: f.text });
            }
            groups.get(key).count += 1;
          }
          const groupList = [...groups.values()].sort(
            (a, b) => SEVERITY_RANK[a.severity] - SEVERITY_RANK[b.severity] || b.count - a.count,
          );

          const parsedMax = parseInt(process.env.MAX_FINDINGS, 10);
          const maxFindings = Number.isInteger(parsedMax) && parsedMax >= 0 ? parsedMax : 10;
          const shownGroups = groupList.slice(0, maxFindings);
          const hiddenGroups = groupList.length - shownGroups.length;
          const hiddenFindings = findings.length - shownGroups.reduce((sum, g) => sum + g.count, 0);

          const detailsBlock = shownGroups.length
            ? [
                '<details>',
                `<summary>Top ${shownGroups.length} rule(s) by occurrence${hiddenGroups > 0 ? ` — ${hiddenGroups} more distinct rule(s), ${hiddenFindings} more finding(s) in the full report` : ''}</summary>`,
                '',
                '| | Rule | Occurrences | Example |',
                '|---|---|---|---|',
                ...shownGroups.map(
                  (g) => `| ${SEVERITY_EMOJI[g.severity]} | **${g.tool}** \`${g.rule}\` | ${g.count} | ${g.example} |`,
                ),
                '',
                '</details>',
              ].join('\n')
            : '';

          const bodyLines = [
            marker,
            anyFailed
              ? `## \u{1F6E1}\u{FE0F} Security scan — incomplete (${process.env.FAILED_SCANNERS} failed to run)`
              : `## \u{1F6E1}\u{FE0F} Security scan — ${findings.length} finding(s)`,
            '',
          ];
          if (headerLine) {
            bodyLines.push(headerLine, '');
          }
          const grypeTarget = process.env.GRYPE_IMAGE
            ? `image \`${process.env.GRYPE_IMAGE}\``
            : 'path scan';
          bodyLines.push(
            '| Scanner | \u{1F534} | \u{1F7E0} | \u{1F7E1} | \u{1F535} | ⚪ | Total |',
            '|---|---|---|---|---|---|---|',
            scannerRow(`Grype (dependency CVEs, ${grypeTarget}, severity >= ${process.env.SEVERITY_CUTOFF})`, 'Grype', process.env.GRYPE_FAILED),
            scannerRow('Trivy (secrets + IaC misconfig)', 'Trivy', process.env.TRIVY_FAILED),
            semgrepRow,
            '',
          );
          if (detailsBlock) {
            bodyLines.push(detailsBlock, '');
          }
          bodyLines.push(`Full JSON reports: [workflow run](${runUrl}) → \`security-scan-reports\` artifact.`);
          const body = bodyLines.join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
